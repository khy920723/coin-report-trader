name: build-exe

on:
  workflow_dispatch:
  # Runs on every pull request so the required "windows" check always reports.
  # The work is skipped when a pull request does not touch app, test, packaging or tool settings files.
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what to run
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          project=false
          build=false
          if [ -f pyproject.toml ]; then
            if [ "$EVENT" != "pull_request" ]; then
              project=true
            else
              # Capture first: a failing git diff stops the step, and grep reads a here-string, not a pipe.
              changed="$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")"
              if grep -qiE '^(src/|tests/|packaging/|scripts/|pyproject\.toml$|uv\.lock$|uv\.toml$|\.python-version$|conftest\.py$|pytest\.ini$|tox\.ini$|setup\.cfg$|[^/]+\.spec$)' <<< "$changed"; then
                project=true
              fi
            fi
          fi
          spec="$(ls packaging/*.spec 2>/dev/null | head -n 1 || true)"
          if [ "$project" = true ] && [ -n "$spec" ]; then
            build=true
          fi
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$build" != true ]; then
            echo "::error::A manual build was requested, but pyproject.toml or packaging/*.spec is missing. There is nothing to build."
            exit 1
          fi
          if [ "$project" != true ]; then
            echo "::notice::No project yet, or no app, test, packaging or tool settings change; skipping the Windows work."
          fi

      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.plan.outputs.project == 'true'
        with:
          python-version: "3.13"
          enable-cache: true
          ignore-nothing-to-cache: true

      - name: Install dependencies
        if: steps.plan.outputs.project == 'true'
        run: uv sync --locked

      - name: Tests on Windows
        if: steps.plan.outputs.project == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Build with PyInstaller
        if: steps.plan.outputs.build == 'true'
        shell: bash
        env:
          SPEC: ${{ steps.plan.outputs.spec }}
        run: uv run pyinstaller "$SPEC" --noconfirm --clean

      - name: Smoke test (--self-test)
        if: steps.plan.outputs.build == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No exe was found under dist."
            exit 1
          }
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if (Test-Path "self-test-report.txt") { Get-Content "self-test-report.txt" }
          if ($p.ExitCode -ne 0) {
            Write-Error "self-test failed with exit code $($p.ExitCode)"
            exit 1
          }

      - name: Upload build (manual runs only, kept for one day)
        if: steps.plan.outputs.build == 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-windows-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
